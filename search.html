<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内部データベース検索結果 | 歴史再現研究所 [SECURE_NODE]</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif; color: #243247; line-height: 1.9; background: #f8fafc; }
    a { color: inherit; text-decoration: none; }

    header { padding: 22px 7%; display: flex; justify-content: space-between; align-items: center; gap: 24px; border-bottom: 1px solid #cbd5e1; background: #ffffff; }
    .brand { font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
    .brand span { display: block; font-size: 10px; color: #0284c7; letter-spacing: .12em; font-weight: 400; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; min-width: 0; }
    nav { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 12px; color: #334155; align-items: center; }
    nav a:hover { color: #0284c7; }

    .header-search { display: flex; width: min(100%, 340px); gap: 6px; background: #f1f5f9; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .header-search input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid #94a3b8; background: #ffffff; color: #0f172a; font-size: 12px; border-radius: 2px; }
    .header-search input:focus { outline: 1px solid #0284c7; }
    .header-search button { padding: 6px 14px; border: 0; background: #0284c7; color: white; font-size: 12px; cursor: pointer; border-radius: 2px; font-weight: 600; }
    .header-search button:hover { background: #0369a1; }

    main { max-width: 1000px; margin: 0 auto; padding: 54px 7% 90px; }
    .eyebrow { color: #0369a1; font-size: 12px; letter-spacing: .16em; font-weight: 600; }
    h1 { color: #0f172a; font-size: 28px; margin: 8px 0 20px; }
    .query-badge { display: inline-block; background: #e2e8f0; color: #0f172a; padding: 2px 10px; border-radius: 4px; font-family: monospace; font-size: 15px; }

    .result-count { font-size: 13px; color: #64748b; margin-bottom: 24px; border-bottom: 1px solid #cbd5e1; padding-bottom: 12px; }

    .result-list { display: flex; flex-direction: column; gap: 16px; }
    .result-item { background: #ffffff; border: 1px solid #cbd5e1; padding: 22px 26px; transition: border-color 0.2s, transform 0.15s; }
    .result-item:hover { border-color: #0284c7; }

    .result-item.classified {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
    }
    .result-item.classified:hover {
      border-color: #38bdf8;
    }
    .result-item.classified .doc-id { color: #38bdf8; }
    .result-item.classified .doc-title { color: #ffffff; }
    .result-item.classified .doc-snippet { color: #cbd5e1; }

    .doc-id { font-family: monospace; font-size: 11px; letter-spacing: 0.1em; color: #0284c7; margin-bottom: 6px; display: block; }
    .doc-title { font-size: 18px; font-weight: 700; color: #0f172a; margin: 0 0 8px; display: block; }
    .doc-title:hover { text-decoration: underline; }
    .doc-snippet { font-size: 13px; color: #475569; margin: 0; line-height: 1.7; }

    .empty-state { background: #ffffff; border: 1px dashed #94a3b8; padding: 40px; text-align: center; color: #475569; font-size: 14px; }

    footer { background: #0f172a; color: #94a3b8; font-size: 12px; text-align: center; }
    .footer-main { padding: 34px 7% 24px; }
    footer .brand { color: #ffffff; }
    footer .brand span { color: #38bdf8; }
    footer p { margin: 12px 0; }
    .fiction-notice { padding: 14px 20px; background: #020617; color: #64748b; font-size: 11px; line-height: 1.8; }

    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .header-right { align-items: flex-start; width: 100%; }
      .header-search { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index-re.html">歴史再現研究所<span>HISTORICAL RECONSTRUCTION INSTITUTE [SECURE_NODE]</span></a>
    <div class="header-right">
      <nav>
        <a href="index-re.html">トップ</a>
        <a href="about-re.html">研究所について</a>
        <a href="director-re.html">所長挨拶</a>
        <a href="research-re.html">研究・技術</a>
        <a href="achievements-re.html">研究実績</a>
      </nav>
      <form class="header-search" action="search.html" method="get">
        <input type="search" name="q" id="search-input" placeholder="内部データベース検索コードを入力…" aria-label="サイト内検索" required>
        <button type="submit">検索</button>
      </form>
    </div>
  </header>

  <main>
    <div class="eyebrow">INTERNAL DATABASE QUERY // RESULTS</div>
    <h1>検索結果：<span class="query-badge" id="query-display"></span></h1>
    <div class="result-count" id="result-count"></div>
    <div class="result-list" id="result-list"></div>
  </main>

  <footer>
    <div class="footer-main">
      <div class="brand">歴史再現研究所<span>HISTORICAL RECONSTRUCTION INSTITUTE</span></div>
      <p>歴史資料の分析と人物モデルの研究を通じて、新たな理解を目指します。</p>
      <p>© Historical Reconstruction Institute</p>
    </div>
    <div class="fiction-notice">当サイトはフィクションです。掲載されている人物・団体・研究内容は創作であり、実在のものとは関係ありません。</div>
  </footer>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const rawQuery = (params.get('q') || '').trim();
      const query = rawQuery.toLowerCase();

      document.getElementById('search-input').value = rawQuery;
      document.getElementById('query-display').textContent = rawQuery || '（未入力）';

      const database = [
        {
          id: "PUBLIC_PAGE // DIRECTOR",
          title: "所長挨拶 - 過去の選択に向き合うということ",
          snippet: "歴史再現研究所 所長 神崎史郎からのご挨拶。過去の意思決定の構造を紐解く試みについて。",
          url: "director-re.html",
          classified: false,
          keywords: ["所長", "挨拶", "神崎", "神崎史郎", "選択", "理念"]
        },
        {
          id: "PUBLIC_PAGE // ABOUT",
          title: "研究所について - 設立の背景と理念",
          snippet: "歴史的史料の解析および人間行動モデルの構築を通じて、過去の事象や人物の判断プロセスを多角的に検証します。",
          url: "about-re.html",
          classified: false,
          keywords: ["研究所", "理念", "設立", "背景", "取り組み"]
        },
        {
          id: "PUBLIC_PAGE // RESEARCH",
          title: "研究・技術 - 史料テキストの構造化と対話シミュレーション",
          snippet: "自然言語処理を用いた古文書解析、行動規範のモデル化、対話シミュレーションによる応答検証手法の紹介。",
          url: "research-re.html",
          classified: false,
          keywords: ["研究", "技術", "対話", "シミュレーション", "自然言語", "モデル"]
        },
        {
          id: "PUBLIC_PAGE // ACHIEVEMENTS",
          title: "研究実績 - 大規模歴史史料テキストデータベース・思念体構築モデル",
          snippet: "戦国期を中心とした歴史上の人物を対象に構築した基礎検証用の思念体モデルと応答傾向の検証記録。",
          url: "achievements-re.html",
          classified: false,
          keywords: ["実績", "研究実績", "思念体", "戦国", "検証"]
        },
        {
          id: "CLASSIFIED // DOC-35 [MEMO_01]",
          title: "備忘録1：初期思念体モデルの特異点について",
          snippet: "【機密記録】対話シミュレーションにおいて、史料に存在しない記憶や感情を訴える個体が発生。特権領域での個別観察を開始する。",
          url: "doc-memo1.html",
          classified: true,
          keywords: ["備忘録", "備忘録1", "特異点", "思念体", "資料35"]
        },
        {
          id: "CLASSIFIED // DOC-36 [MEMO_02]",
          title: "備忘録2：『不適合者』の選別基準と桐生との見解の相違",
          snippet: "【機密記録】再現率の低い個体は『不適合者』として隔離処理する。副所長の桐生は倫理的懸念を口にしているが、研究の完遂が最優先だ。",
          url: "doc-memo2.html",
          classified: true,
          keywords: ["備忘録", "備忘録2", "不適合者", "桐生", "隔離", "資料36"]
        },
        {
          id: "CLASSIFIED // DOC-37 [MEMO_03]",
          title: "備忘録3：最初の証人と人事記録の書き換え",
          snippet: "【機密記録】桐生は理解者ではなく妨害者となった。彼を最初の証人として深層領域へ接続する。システム上のステータスは『自己都合退職』へ変更済み。",
          url: "doc-memo3.html",
          classified: true,
          keywords: ["備忘録", "備忘録3", "桐生", "自己都合退職", "証人", "資料37"]
        },
        {
          id: "CLASSIFIED // DOC-43 [HANDOVER]",
          title: "【引き継ぎ】端末管理および特権アカウント管理について",
          snippet: "【内部通達・アルバイト作成】特権端末の保守およびアカウント引き継ぎに関する手順書。管理者権限の取り扱いに関する注意事項。",
          url: "doc-43.html",
          classified: true,
          keywords: ["資料43", "引き継ぎ", "端末管理", "特権", "アカウント", "アルバイト", "ヘルプ", "help"]
        },
        {
          id: "RESTRICTED // EMERGENCY_PROTOCOL",
          title: "【警告】緊急救難信号（HELP）検知ログ",
          snippet: "【システム警告】特権領域の深層ノードから外部への救難信号パターンを検知。発信元は抹消済み職員IDと一致。",
          url: "doc-help.html",
          classified: true,
          keywords: ["help", "ヘルプ", "警告", "救難", "かんしされている"]
        }
      ];

      const listEl = document.getElementById('result-list');
      const countEl = document.getElementById('result-count');

      if (!query) {
        countEl.textContent = "検索キーワードを入力してください。";
        listEl.innerHTML = '<div class="empty-state">上部の検索バーに調査したいキーワード（人物名、資料番号、用語など）を入力して検索を実行してください。</div>';
        return;
      }

      const hits = database.filter(item => {
        return item.title.toLowerCase().includes(query) ||
               item.snippet.toLowerCase().includes(query) ||
               item.keywords.some(k => k.toLowerCase().includes(query) || query.includes(k.toLowerCase()));
      });

      countEl.textContent = `該当件数：${hits.length} 件`;

      if (hits.length === 0) {
        listEl.innerHTML = `<div class="empty-state">「${rawQuery}」に一致する内部記録・文書は見つかりませんでした。<br><span style="font-size:12px; color:#94a3b8;">別のキーワード、または資料内の関連語句で再検索してください。</span></div>`;
      } else {
        hits.forEach(item => {
          const card = document.createElement('article');
          card.className = 'result-item' + (item.classified ? ' classified' : '');
          card.innerHTML = `
            <span class="doc-id">${item.id}</span>
            <a class="doc-title" href="${item.url}">${item.title}</a>
            <p class="doc-snippet">${item.snippet}</p>
          `;
          listEl.appendChild(card);
        });
      }
    })();
  </script>
</body>
</html>
