
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="歴史再現研究所のサイト内検索ページです。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイト内検索 | 歴史再現研究所</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif;
      color: #243247;
      line-height: 1.9;
      background: #fff;
    }

    a { color: inherit; text-decoration: none; }

    header {
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid #e5eaf0;
    }

    .brand {
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .brand span {
      display: block;
      font-size: 10px;
      color: #718096;
      letter-spacing: .12em;
      font-weight: 400;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      font-size: 12px;
      color: #526174;
      align-items: center;
    }

    nav a:hover { color: #1b4c7d; }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 64px 7% 90px;
      min-height: 65vh;
    }

    .eyebrow {
      color: #56718f;
      font-size: 12px;
      letter-spacing: .16em;
    }

    h1 {
      color: #102744;
      font-size: 34px;
      margin: 10px 0;
    }

    .intro {
      color: #637083;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .search-form {
      display: flex;
      gap: 10px;
      width: 100%;
      margin: 24px 0 36px;
    }

    .search-form input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      font-size: 15px;
      color: #243247;
      background: #fff;
    }

    .search-form input:focus {
      outline: 2px solid #8aa8c8;
      outline-offset: 2px;
    }

    .search-form button {
      padding: 12px 24px;
      border: 0;
      border-radius: 3px;
      background: #173858;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .search-form button:hover { background: #244f7b; }

    .result-heading {
      font-size: 18px;
      color: #102744;
      border-bottom: 1px solid #dce4ed;
      padding-bottom: 10px;
      margin-top: 30px;
    }

    .result {
      padding: 20px 0;
      border-bottom: 1px solid #e5eaf0;
    }

    .result h2 {
      font-size: 17px;
      color: #244f7b;
      margin: 0 0 6px;
    }

    .result p {
      font-size: 14px;
      color: #637083;
      margin: 0;
    }

    .result a:hover h2 { text-decoration: underline; }

    .restricted {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid #d7dfe8;
      border-left: 4px solid #173858;
      background: #f7f9fc;
    }

    .restricted-label {
      display: inline-block;
      font-size: 10px;
      letter-spacing: .12em;
      color: #526174;
      border: 1px solid #bdc9d7;
      padding: 2px 8px;
      margin-bottom: 10px;
    }

    .restricted h2 {
      color: #173858;
      font-size: 17px;
      margin: 0 0 8px;
    }

    .restricted p {
      font-size: 14px;
      color: #526174;
      margin: 0;
    }

    .empty {
      padding: 24px 0;
      font-size: 14px;
      color: #637083;
    }

    footer {
      background: #102744;
      color: #d4dfeb;
      font-size: 12px;
      text-align: center;
    }

    .footer-main { padding: 34px 7% 24px; }

    footer .brand { color: #fff; }
    footer .brand span { color: #aebdd0; }
    footer p { margin: 12px 0; }

    .fiction-notice {
      padding: 14px 20px;
      background: #0b192b;
      color: #aebdd0;
      font-size: 11px;
      line-height: 1.8;
    }

    @media (max-width: 760px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main { padding-top: 44px; }

      h1 { font-size: 29px; }

      .search-form button { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">
      歴史再現研究所
      <span>HISTORICAL RECONSTRUCTION INSTITUTE</span>
    </a>

    <nav>
      <a href="index.html">トップ</a>
      <a href="about.html">研究所について</a>
      <a href="director.html">所長挨拶</a>
      <a href="research.html">研究・技術</a>
      <a href="achievements.html">研究実績</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">SITE SEARCH</div>
    <h1>サイト内検索</h1>
    <p class="intro">研究所の公開情報を検索できます。キーワードを入力してください。</p>

    <form class="search-form" id="searchForm">
      <input
        type="search"
        id="searchInput"
        name="q"
        placeholder="キーワードを入力…"
        aria-label="検索キーワード"
        required
      >
      <button type="submit">検索</button>
    </form>

    <div id="results" aria-live="polite"></div>
  </main>

  <footer>
    <div class="footer-main">
      <div class="brand">
        歴史再現研究所
        <span>HISTORICAL RECONSTRUCTION INSTITUTE</span>
      </div>
      <p>歴史資料の分析と人物モデルの研究を通じて、新たな理解を目指します。</p>
      <p>© Historical Reconstruction Institute</p>
    </div>
    <div class="fiction-notice">
      当サイトはフィクションです。掲載されている人物・団体・研究内容は創作であり、実在のものとは関係ありません。
    </div>
  </footer>

  <script>
    const pages = [
      {
        title: "研究所について",
        url: "about.html",
        description: "歴史再現研究所の設立目的、基本方針、主な活動について紹介します。",
        keywords: "研究所 設立 目的 基本方針 活動 歴史 資料"
      },
      {
        title: "所長挨拶",
        url: "director.html",
        description: "所長より、研究所の理念と歴史研究に対する考え方をご紹介します。",
        keywords: "所長 挨拶 理念 研究 方針 神崎 史郎"
      },
      {
        title: "研究・技術",
        url: "research.html",
        description: "歴史資料の分析、人物モデルの構築、対話シミュレーションについて紹介します。",
        keywords: "研究 技術 AI 人工知能 人物モデル 対話 シミュレーション 応答記録"
      },
      {
        title: "研究実績",
        url: "achievements.html",
        description: "織田信長、豊臣秀吉、徳川家康を対象とした人物モデルの研究状況を掲載しています。",
        keywords: "研究実績 信長 織田信長 秀吉 豊臣秀吉 家康 徳川家康 モデル"
      }
    ];

    const restrictedResult = {
      title: "人物モデル応答記録／ODA-NOBUNAGA",
      description: "分類：内部検証資料。通常の検証手順では想定されていない応答が記録されています。記録の詳細および発生条件については、関連資料を確認してください。"
    };

    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");

    function runSearch() {
      const query = input.value.trim().toLowerCase();

      results.replaceChildren();

      if (!query) {
        return;
      }

      const heading = document.createElement("h2");
      heading.className = "result-heading";
      heading.textContent = "検索結果";
      results.appendChild(heading);

      const matches = pages.filter(page =>
        (page.title + " " + page.description + " " + page.keywords)
          .toLowerCase()
          .includes(query)
      );

      matches.forEach(page => {
        const article = document.createElement("article");
        article.className = "result";

        const link = document.createElement("a");
        link.href = page.url;

        const title = document.createElement("h2");
        title.textContent = page.title;

        const description = document.createElement("p");
        description.textContent = page.description;

        link.appendChild(title);
        article.appendChild(link);
        article.appendChild(description);
        results.appendChild(article);
      });

      if (query.includes("応答記録")) {
        const restricted = document.createElement("article");
        restricted.className = "restricted";

        const label = document.createElement("div");
        label.className = "restricted-label";
        label.textContent = "RESTRICTED RECORD";

        const title = document.createElement("h2");
        title.textContent = restrictedResult.title;

        const description = document.createElement("p");
        description.textContent = restrictedResult.description;

        restricted.appendChild(label);
        restricted.appendChild(title);
        restricted.appendChild(description);
        results.appendChild(restricted);
      }

      if (matches.length === 0 && !query.includes("応答記録")) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "一致する情報は見つかりませんでした。キーワードを変更して、もう一度検索してください。";
        results.appendChild(empty);
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) {
        return;
      }

      const params = new URLSearchParams();
      params.set("q", query);

      window.location.href = "search.html?" + params.toString();
    });

    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q");

    if (initialQuery) {
      input.value = initialQuery;
      runSearch();
    }
  </script>
</body>
</html>
