<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>サイト内検索｜歴史再現研究所</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #263449;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN",
        Meiryo, sans-serif;
      line-height: 1.8;
    }

    header {
      background: #172b49;
      color: white;
      padding: 22px 7%;
    }

    .site-name {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .site-subtitle {
      font-size: 11px;
      color: #c6d1e0;
      letter-spacing: 0.12em;
    }

    nav {
      background: #fff;
      border-bottom: 1px solid #dce2e9;
      padding: 10px 7%;
      font-size: 12px;
    }

    nav a {
      color: #526783;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 38px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 25px;
      color: #172b49;
      margin-bottom: 5px;
    }

    .lead {
      color: #68788d;
      font-size: 13px;
      margin-bottom: 26px;
    }

    .search-box {
      background: #fff;
      border: 1px solid #d5dce5;
      padding: 24px;
      margin-bottom: 28px;
    }

    .search-form {
      display: flex;
      gap: 10px;
    }

    .search-form input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #c7d0dc;
      border-radius: 2px;
      font-size: 15px;
      color: #263449;
    }

    .search-form button {
      padding: 11px 23px;
      background: #172b49;
      color: white;
      border: none;
      border-radius: 2px;
      font-size: 14px;
      cursor: pointer;
    }

    .search-form button:hover {
      background: #2b4569;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 1px solid #cbd4df;
      padding-bottom: 10px;
      margin-bottom: 0;
    }

    .result-heading h2 {
      font-size: 17px;
      margin: 0;
      color: #172b49;
    }

    .result-count {
      font-size: 12px;
      color: #718096;
      white-space: nowrap;
    }

    .result-item {
      display: block;
      background: #fff;
      border: 1px solid #dce2e9;
      border-top: none;
      padding: 20px 22px;
      color: inherit;
      text-decoration: none;
    }

    .result-item:hover {
      background: #f8fafd;
    }

    .result-category {
      color: #667d9a;
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .result-title {
      color: #244b7b;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .result-description {
      color: #526174;
      font-size: 13px;
      margin: 0;
    }

    .result-meta {
      font-size: 11px;
      color: #8a96a5;
      margin-top: 8px;
    }

    .empty-state,
    .initial-state {
      background: #fff;
      border: 1px solid #dce2e9;
      padding: 25px;
      color: #68788d;
      font-size: 13px;
    }

    .initial-state button {
      background: none;
      border: none;
      padding: 0;
      color: #244b7b;
      text-decoration: underline;
      cursor: pointer;
      font: inherit;
    }

    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 13px;
      color: #284b78;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #7c8999;
      font-size: 11px;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 25px;
      }

      h1 {
        font-size: 22px;
      }

      .search-box {
        padding: 16px;
      }

      .search-form {
        flex-direction: column;
      }

      .search-form button {
        padding: 12px;
      }

      .result-item {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="site-name">歴史再現研究所</div>
    <div class="site-subtitle">
      HISTORICAL RECONSTRUCTION INSTITUTE
    </div>
  </header>

  <nav>
    <a href="index.html">トップページ</a>
    ＞ サイト内検索
  </nav>

  <main>
    <h1>サイト内検索</h1>

    <p class="lead">
      当研究所の活動内容・研究資料等を検索できます。
    </p>

    <section class="search-box">
      <form class="search-form" id="searchForm">
        <input
          type="search"
          id="searchInput"
          name="q"
          placeholder="検索キーワードを入力"
          aria-label="検索キーワード"
        >
        <button type="submit">検索</button>
      </form>
    </section>

    <section id="resultsArea" aria-live="polite"></section>

    <a class="back-link" href="index.html">
      ← トップページに戻る
    </a>
  </main>

  <footer>
    © 歴史再現研究所 HISTORICAL RECONSTRUCTION INSTITUTE
  </footer>

  <script>
    const publicResults = [
      {
        title: "研究所について",
        description: "歴史再現研究所の設立目的、沿革、基本情報。",
        category: "研究所案内",
        url: "about.html",
        keywords: ["研究所", "概要", "設立", "沿革"]
      },
      {
        title: "研究・技術",
        description: "思念型歴史個体（思念体）の構築・検証方針。",
        category: "研究案内",
        url: "research.html",
        keywords: ["研究", "技術", "理念", "方針", "思念体", "個体", "思念型歴史個体"]
      },
      {
        title: "研究実績",
        description: "当研究所における研究活動および主な実績。",
        category: "研究案内",
        url: "achievements.html",
        keywords: ["研究実績", "実績", "成果"]
      },
      {
        title: "所長紹介",
        description: "歴史再現研究所 所長・神崎史郎について。",
        category: "研究所案内",
        url: "director.html",
        keywords: ["所長", "神崎史郎", "神崎", "人物紹介"]
      }
    ];

    const researchRecords = [
      {
        title: "織田信長 思念体記録",
        description: "織田信長に関する思念体（ODA-NOBUNAGA）の研究記録。",
        category: "研究資料",
        url: "record.html",
        keywords: ["思念体", "個体", "織田信長", "信長", "ODA-NOBUNAGA"]
      },
      {
        title: "徳川家康 思念体記録",
        description: "徳川家康に関する思念体（TOKUGAWA-IEYASU）の研究記録。",
        category: "研究資料",
        url: "record-ieyasu.html",
        keywords: ["思念体", "個体", "徳川家康", "家康", "TOKUGAWA-IEYASU"]
      },
      {
        title: "豊臣秀吉 思念体記録",
        description: "豊臣秀吉に関する思念体（TOYOTOMI-HIDEYOSHI）の研究記録。",
        category: "研究資料",
        url: "record-hideyoshi.html",
        keywords: ["思念体", "個体", "豊臣秀吉", "秀吉", "TOYOTOMI-HIDEYOSHI"]
      }
    ];

    const restrictedResults = [
      {
        title: "人物調査記録：神崎史郎",
        description: "所長に関する人物情報および関連記録。",
        category: "内部資料",
        url: "record-kanzaki.html",
        keywords: ["人物調査記録", "神崎史郎", "神崎", "HRK-001"]
      },
      {
        title: "人物調査記録：研究補助部門職員",
        description: "研究補助部門 職員基本情報・勤務評価。",
        category: "内部資料",
        url: "record-friend.html",
        keywords: ["人物調査記録", "職員", "アルバイト", "勤務評価"]
      }
    ];

    const allResults = [
      ...publicResults,
      ...researchRecords,
      ...restrictedResults
    ];

    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const resultsArea = document.getElementById("resultsArea");

    function showInitialState() {
      resultsArea.innerHTML = `
        <div class="initial-state">
          <p>検索キーワードを入力してください。</p>
          <p>
            例：
            <button type="button" data-query="研究所">研究所</button> 
            <button type="button" data-query="思念体">思念体</button>
          </p>
        </div>
      `;
    }

    function createResultElement(item, query) {
      const link = document.createElement("a");
      link.className = "result-item";

      link.href = item.url + "?fromSearch=" +
        encodeURIComponent(query);

      const category = document.createElement("div");
      category.className = "result-category";
      category.textContent = item.category;

      const title = document.createElement("div");
      title.className = "result-title";
      title.textContent = item.title;

      const description = document.createElement("p");
      description.className = "result-description";
      description.textContent = item.description;

      const meta = document.createElement("div");
      meta.className = "result-meta";
      meta.textContent = "歴史再現研究所";

      link.append(category, title, description, meta);

      return link;
    }

    function search(query) {
      const normalizedQuery = query.trim().toLowerCase();

      resultsArea.replaceChildren();

      if (!normalizedQuery) {
        showInitialState();
        return;
      }

      const matchedResults = allResults.filter(item =>
        item.keywords.some(keyword =>
          normalizedQuery.includes(keyword.toLowerCase())
        )
      );

      const heading = document.createElement("div");
      heading.className = "result-heading";

      const headingTitle = document.createElement("h2");
      headingTitle.textContent = "検索結果";

      const count = document.createElement("span");
      count.className = "result-count";
      count.textContent = matchedResults.length + "件";

      heading.append(headingTitle, count);
      resultsArea.appendChild(heading);

      if (matchedResults.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent =
          "該当するページは見つかりませんでした。検索語句を変更してください。";
        resultsArea.appendChild(empty);
        return;
      }

      matchedResults.forEach(item => {
        resultsArea.appendChild(createResultElement(item, query));
      });
    }

    function updateAddress(query) {
      const url = new URL(window.location.href);

      if (query) {
        url.searchParams.set("q", query);
      } else {
        url.searchParams.delete("q");
      }

      history.replaceState({}, "", url.pathname + url.search);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const query = input.value.trim();
      updateAddress(query);
      search(query);
    });

    resultsArea.addEventListener("click", event => {
      const button = event.target.closest("button[data-query]");

      if (!button) return;

      const query = button.dataset.query;
      input.value = query;
      updateAddress(query);
      search(query);
    });

    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q") || "";

    input.value = initialQuery;
    search(initialQuery);

    window.addEventListener("popstate", () => {
      const currentParams =
        new URLSearchParams(window.location.search);
      const query = currentParams.get("q") || "";

      input.value = query;
      search(query);
    });
  </script>
</body>
</html>
