<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歴史再現研究所</title>
  <style>
    body {
  margin: 0;
  background-color: #f8fafc;
  color: #26384d;
  font-family: "Noto Sans JP", sans-serif;
  line-height: 1.8;
}

header {
  background-color: #ffffff;
  border-bottom: 1px solid #d9e1ea;
  padding: 24px 8%;
}

header h1 {
  color: #183153;
  margin: 0;
  font-size: 28px;
  letter-spacing: 0.08em;
}

header p {
  color: #64748b;
  margin: 4px 0 0;
  font-size: 14px;
}

main {
  max-width: 900px;
  margin: 48px auto;
  padding: 0 24px;
}

h2 {
  color: #183153;
  font-size: 22px;
  border-bottom: 2px solid #183153;
  padding-bottom: 8px;
  margin-top: 40px;
}

main p {
  font-size: 16px;
}

footer {
  background-color: #183153;
  color: #ffffff;
  text-align: center;
  padding: 20px;
  margin-top: 64px;
  font-size: 13px;
}
</style>
</head>
<body>
  <header>
    <h1>歴史再現研究所</h1>
    <p>歴史資料と未解明現象の関連性を研究する</p>
  </header>

  <main>
    <h2>研究所について</h2>
    <p>
      歴史再現研究所は、古文書や歴史記録の調査を通じ、
      過去と現在のつながりを研究する機関です。
    </p>

    <h2>研究協力者募集</h2>
    <p>
      当研究所では、歴史資料の調査に協力していただける方を
      募集しています。
    </p>
  </main>

  <footer>
    <p>歴史再現研究所</p>
  </footer>
</body>
</html>
